name: Test JDM Car Import

on:
  workflow_dispatch:

jobs:
  import-cars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test BE FORWARD S15 import
        run: python scripts/import-beforward.py
