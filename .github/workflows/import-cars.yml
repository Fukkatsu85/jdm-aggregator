name: Test JDM Car Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out JDM aggregator
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import BE FORWARD listings
        run: python scripts/import-beforward.py

      - name: Import GARAGE-R inventory
        run: python scripts/import-garage-r.py
        
      - name: Commit updated aggregator listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cars.json data/garage-r-ids.json data/garage-r-cars.json

          if git diff --cached --quiet; then
            echo "Aggregator inventory already up to date."
          else
            git commit -m "Update BE FORWARD car listings"
            git push
          fi

      - name: Stage car inventory for sync
        run: |
          cp data/cars.json "$RUNNER_TEMP/cars.json"

      - name: Check out Fukkatsu site
        uses: actions/checkout@v5
        with:
          repository: Fukkatsu85/Fukkatsu-site
          token: ${{ secrets.FUKKATSU_PAT }}
          path: fukkatsu-site

      - name: Sync cars to Fukkatsu
        run: |
          cp "$RUNNER_TEMP/cars.json" "$GITHUB_WORKSPACE/fukkatsu-site/Cars/data/cars.json"

          cd "$GITHUB_WORKSPACE/fukkatsu-site"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cars/data/cars.json

          if git diff --cached --quiet; then
            echo "Fukkatsu car inventory already up to date."
          else
            git commit -m "Update Fukkatsu Cars inventory"
            git push
          fi
