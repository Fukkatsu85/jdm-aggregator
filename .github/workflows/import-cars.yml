name: Test JDM Car Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Fukkatsu site
        uses: actions/checkout@v5
        with:
          repository: Fukkatsu85/Fukkatsu-site
          token: ${{ secrets.FUKKATSU_PAT }}
          path: fukkatsu-site

      - name: Sync cars to Fukkatsu
        run: |
          cp "$GITHUB_WORKSPACE/data/cars.json" "$GITHUB_WORKSPACE/fukkatsu-site/Cars/data/cars.json"

          cd "$GITHUB_WORKSPACE/fukkatsu-site"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cars/data/cars.json

          if git diff --cached --quiet; then
            echo "Fukkatsu car inventory already up to date."
          else
            git commit -m "Update Fukkatsu Cars inventory"
            git push
          fi
