name: Test JDM Car Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test BE FORWARD S15 import
        run: python scripts/import-beforward.py

      - name: Commit updated car listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cars.json

          if git diff --cached --quiet; then
            echo "No listing changes to commit."
          else
            git commit -m "Update BE FORWARD car listings"
            git push
          fi     
